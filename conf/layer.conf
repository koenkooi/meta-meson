# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meson"
BBFILE_PATTERN_meson = "^${LAYERDIR}/"
BBFILE_PRIORITY_meson = "1"
LAYERSERIES_COMPAT_meson = "walnascar whinlatter wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_meson = "1"

LAYERDEPENDS_meson = "core"

# This layer's .wks files live in wic/, not the files/wic/ convention the
# default WKS_SEARCH_PATH (image_types_wic.bbclass) actually searches.
# A layer.conf :append runs before any recipe inherits image_types_wic's own
# weak default, so a bare :append here would silently replace that default
# for every machine in the build, not just add to it -- replicate the
# default here first (weak, so it's a no-op if oe-core's own already fired)
# so the append composes instead of clobbering.
WKS_SEARCH_PATH ?= "${THISDIR}:${@':'.join('%s/files/wic' % p for p in '${BBPATH}'.split(':'))}"
WKS_SEARCH_PATH:append = ":${LAYERDIR}/wic"
